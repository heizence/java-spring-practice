spring:
  application:
    name: bookstore

  # No URL, user or password: `bootRun` connects to the MySQL in compose.yaml (Spring Boot's Docker Compose support),
  # and tests connect to their own MySQL container (Testcontainers).
  datasource:
    hikari:
      data-source-properties:
        # DATETIME columns hold UTC times. Tell MySQL Connector/J, so that plain JDBC code (JdbcClient, JdbcTemplate)
        # also reads and writes Instants correctly, whatever the JVM's default time zone is.
        connectionTimeZone: UTC

  flyway:
    # Flyway creates the schema and loads the seed data at startup: src/main/resources/db/migration/V*.sql.
    enabled: true

  web:
    # Error messages, including bean validation messages, are always in English, whatever language the client asks
    # for in its Accept-Language header.
    locale: en
    locale-resolver: fixed

logging:
  level:
    # Flyway warns at every start that it was verified with MySQL up to 9.4 only. 9.7 works; the warning is noise.
    org.flywaydb.core.internal.database.base.Database: error
    # SQL logging is off. To see every statement JdbcClient runs, and the values bound to it, uncomment these lines:
    # org.springframework.jdbc.core.JdbcTemplate: debug
    # org.springframework.jdbc.core.StatementCreatorUtils: trace
