spring:
  application:
    name: bookstore

  # No URL, user or password: `bootRun` connects to the MySQL in compose.yaml (Spring Boot's Docker Compose support),
  # and tests connect to their own MySQL container (Testcontainers).
  datasource:
    hikari:
      data-source-properties:
        # DATETIME columns hold UTC times. Tell MySQL Connector/J, so that plain JDBC code (JdbcClient, JdbcTemplate)
        # also reads and writes Instants correctly, whatever the JVM's default time zone is.
        connectionTimeZone: UTC

  flyway:
    # Flyway creates the schema and loads the seed data at startup: src/main/resources/db/migration/V*.sql.
    enabled: true

  jpa:
    # Close the database session when the service's transaction ends, not when the response is written. Lazy
    # loading in a controller then fails fast instead of running hidden queries.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks at startup that the entities match it, and never changes it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Read and write DATETIME columns as UTC, whatever the JVM's default time zone is.
          time_zone: UTC
        query:
          # A query that fetch-joins a collection can't be paged in SQL, so Hibernate would load every row and page
          # in memory. Fail instead, so the problem shows up in tests.
          fail_on_pagination_over_collection_fetch: true
        # Deliberately not set:
        # - default_batch_fetch_size: loading lazy associations in batches hides N+1 query problems. Add it once
        #   you can see the problem it solves.
        # - jdbc.batch_size: inserts can't be batched anyway, because every id is an AUTO_INCREMENT (IDENTITY) id.

  web:
    # Error messages, including bean validation messages, are always in English, whatever language the client asks
    # for in its Accept-Language header.
    locale: en
    locale-resolver: fixed

bookstore:
  security:
    # The access tokens of POST /api/auth/token (see JwtProperties).
    jwt:
      # Every token names the bookstore as its issuer ("iss"), and the bookstore accepts only tokens it issued itself.
      issuer: bookstore
      # Short on purpose: a stolen token works until it expires.
      time-to-live: 15m
      # The key that signs and checks tokens (HMAC-SHA256): at least 32 bytes, Base64-encoded. This value is for
      # local development and tests only, so it is no secret: it decodes to "bookstore: local development only, not a
      # secret". Production sets the environment variable BOOKSTORE_SECURITY_JWT_SECRET to its own random key
      # (openssl rand -base64 32), which overrides this value.
      secret: Ym9va3N0b3JlOiBsb2NhbCBkZXZlbG9wbWVudCBvbmx5LCBub3QgYSBzZWNyZXQ=

logging:
  level:
    # Flyway warns at every start that it was verified with MySQL up to 9.4 only. 9.7 works; the warning is noise.
    org.flywaydb.core.internal.database.base.Database: error
    # To see which security filter rejected a request, and why, uncomment this line:
    # org.springframework.security: trace
    # SQL logging is off. To see every statement Hibernate runs, and the values bound to it, uncomment these lines:
    # org.hibernate.SQL: debug
    # org.hibernate.orm.jdbc.bind: trace
